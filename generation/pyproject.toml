[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agile3d"
version = "0.8.1rc1"
description = "AGILE object generation, VLM or Codex review, mesh evaluation, and HOI handoff"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3", "scipy>=1.11,<2", "Pillow>=10.4", "pydantic>=2.8,<3",
  "trimesh>=4.5,<5", "filelock>=3.15,<4",
]

[project.optional-dependencies]
gemini = ["google-genai>=1.75,<2", "httpx[socks]>=0.28,<1"]
agent = ["mcp>=1.12,<2"]
dev = ["pytest>=8,<9"]

[project.scripts]
agile = "agile3d.cli:main"
agile-mcp = "agile3d.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
